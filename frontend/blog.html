<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QAForge Blog Insight</title>
  <link rel="stylesheet" href="css/app.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      margin: 0;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: white;
      text-decoration: none;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary), var(--accent-1));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-icon svg { width: 20px; height: 20px; }
    .nav-cta {
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 0.5rem 1.25rem;
      border-radius: var(--radius);
      font-weight: 600;
      transition: background 0.2s;
    }
    .nav-cta:hover { filter: brightness(1.1); }
    
    .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
    }
    .nav-link {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.2s ease;
      text-decoration: none;
    }
    .nav-link:hover { color: var(--text-primary); }

    .menu-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      padding: 5px;
      z-index: 101;
      background: none;
      border: none;
      cursor: pointer;
    }
    .menu-toggle span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--text-primary);
      transition: all 0.3s;
    }
    .menu-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .menu-toggle.active span:nth-child(2) { opacity: 0; }
    .menu-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    @media (max-width: 768px) {
      .menu-toggle { display: flex; }
      .nav-links {
        position: fixed;
        top: 0;
        right: 0;
        height: 100vh;
        width: 250px;
        background: var(--bg-surface);
        flex-direction: column;
        justify-content: center;
        transform: translateX(100%);
        transition: transform 0.3s ease;
        border-left: 1px solid var(--border);
        box-shadow: -5px 0 30px rgba(0,0,0,0.5);
      }
      .nav-links.active { transform: translateX(0); }
      .nav-cta { display: none; }
    }
    .blog-container {
      max-width: 800px;
      margin: 4rem auto;
      padding: 0 2rem;
    }
    .blog-header { margin-bottom: 3rem; }
    .blog-tag {
      background: rgba(99, 102, 241, 0.1);
      color: var(--primary);
      padding: 0.25rem 0.75rem;
      border-radius: 100px;
      font-size: 0.875rem;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 1rem;
    }
    .blog-title {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      line-height: 1.2;
    }
    .blog-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    .author-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .author-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
    }
    .author-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .blog-content {
      font-size: 1.125rem;
      line-height: 1.8;
      color: var(--text-secondary);
    }
    .blog-content p {
      margin-bottom: 1.5rem;
    }
    .error-state {
      text-align: center;
      padding: 4rem;
      color: var(--danger);
    }
    .loading-state {
      text-align: center;
      padding: 4rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2" stroke-linejoin="round" fill="none" />
        </svg>
      </div>
      QAForge
    </a>
    <div class="nav-links" id="navLinks">
      <a href="/#features" class="nav-link">Features</a>
      <a href="/#models" class="nav-link">AI Models</a>
      <a href="/#how" class="nav-link">Workflow</a>
      <a href="/#contact" class="nav-link">Contact Us</a>
    </div>
    <a href="app.html" class="nav-cta">Launch App</a>
    <button class="menu-toggle" id="menuToggle">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <main class="blog-container" id="blogContainer">
    <div class="loading-state">
      <i class="fas fa-circle-notch fa-spin fa-2x"></i>
      <p style="margin-top: 1rem">Loading article...</p>
    </div>
  </main>

  <script>
    async function loadBlog() {
      const urlParams = new URLSearchParams(window.location.search);
      const blogId = urlParams.get('id');
      const container = document.getElementById('blogContainer');

      if (!blogId) {
        container.innerHTML = '<div class="error-state"><h2>Article not found</h2><p>No blog ID provided.</p><br><a href="/" style="color:var(--primary); text-decoration: none;">&larr; Return Home</a></div>';
        return;
      }

      try {
        const response = await fetch(`/api/blogs/${blogId}`);
        if (!response.ok) throw new Error('Blog not found');
        const blog = await response.json();

        // Basic parsing of double-newline delimited text into paragraphs
        const contentHtml = blog.content.split('\n\n').map(p => `<p>${p}</p>`).join('');

        const key = (blog.category || '').toUpperCase();
        const images = {
          'AI': 'blog_ai.png',
          'SECURITY': 'blog_security.png',
          'PERFORMANCE': 'blog_ai.png',
          'AUTOMATION': 'blog_automation.png',
          'MANUAL-AI': 'blog_manual_ai.png'
        };
        const imgSrc = 'assets/' + (images[key] || 'blog_ai.png');

        container.innerHTML = `
          <header class="blog-header">
            <span class="blog-tag">${blog.category || 'Article'}</span>
            <h1 class="blog-title">${blog.title}</h1>
            <div class="blog-meta">
              <div class="author-info">
                <div class="author-avatar">
                  <img src="assets/akhil.jpg" alt="${blog.author}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(blog.author || 'User')}&background=6366f1&color=fff'">
                </div>
                <div>
                  <strong>${blog.author || 'QAForge Team'}</strong>
                  <div style="font-size: 0.75rem">${blog.author_role || ''}</div>
                </div>
              </div>
              <div style="width: 1px; height: 30px; background: var(--border); margin: 0 0.5rem"></div>
              <div>
                <div>${blog.date || new Date().toLocaleDateString()}</div>
                <div>${blog.read_time || '5 min read'}</div>
              </div>
            </div>
            <div style="margin-top: 2rem; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
              <img src="${imgSrc}" alt="${blog.title}" style="width: 100%; height: auto; max-height: 400px; object-fit: cover;" />
            </div>
          </header>
          <div class="blog-content">
            ${contentHtml}
          </div>
          <div style="margin-top: 4rem; text-align: center;">
            <a href="/" style="color: var(--primary); text-decoration: none; font-weight: 500;">&larr; Back to all articles</a>
          </div>
        `;
      } catch (error) {
        container.innerHTML = `<div class="error-state"><h2>Error</h2><p>Could not load the article. It may have been removed.</p><br><a href="/" style="color:var(--primary); text-decoration: none;">&larr; Return Home</a></div>`;
      }
    }

    loadBlog();

    // Mobile menu toggle
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    if (menuToggle && navLinks) {
      menuToggle.onclick = () => {
        menuToggle.classList.toggle('active');
        navLinks.classList.toggle('active');
      };
      document.addEventListener('click', (e) => {
        if (!e.target.closest('nav') && navLinks.classList.contains('active')) {
          menuToggle.classList.remove('active');
          navLinks.classList.remove('active');
        }
      });
    }
  </script>
</body>
</html>
